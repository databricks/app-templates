[project]
name = "agent-server"
version = "0.1.0"
description = "MLflow-compatible agent server with FastAPI, powered by Google ADK"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-sdk>=0.44.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.0",
    # The `mcp` extra provides MCPToolset (Databricks-hosted tools) and the `mcp>=2.2` that
    # litellm 1.106+ imports on every completion() with tools. google-adk 2.11.0 is the first
    # release whose MCP extra allows mcp 2.x.
    "google-adk[mcp]>=2.11.0,<3",
    # Same upper bound as google-adk's own extras: litellm 1.107.0 was a compromised release
    # (https://docs.litellm.ai/blog/security-incident-oct-21-2026), and 1.106.2 is the version
    # LiteLLM tells users to pin to. Raise it only after checking the newer release is clean.
    "litellm>=1.104.0,<1.106.3",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
]

setup = [
    "ruamel.yaml>=0.18.0",
]

[tool.uv]
# BEGIN synced constraints (.scripts/source/constraints.txt)
constraint-dependencies = [
    "certifi>=2026.10.18",
]
# END synced constraints
# Dependency cooldown: skip package versions published in the last 7 days (uv >= 0.9.17)
exclude-newer = "7 days"
default-groups = ["dev", "setup"]


[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
discover-tools = "scripts.discover_tools:main"
preflight = "scripts.preflight:main"
