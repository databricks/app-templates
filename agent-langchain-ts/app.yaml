command:
  - bash
  - start.sh

env:
  # Model serving endpoint
  - name: DATABRICKS_MODEL
    value: "databricks-claude-sonnet-4-5"

  # MLflow tracing
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
    valueFrom: "mlflow-tracing-warehouse"
  - name: MLFLOW_UC_CATALOG
    value: "main"
  - name: MLFLOW_UC_SCHEMA
    value: "agent_traces"
  - name: MLFLOW_UC_TABLE_PREFIX
    value: "agents_on_apps"
  - name: MLFLOW_OTEL_SPANS_TABLE
    value: "main.agent_traces.agents_on_apps_otel_spans"

  # Server configuration
  - name: PORT
    value: "8000"

  # UI Backend URL (for reverse proxy)
  - name: UI_BACKEND_URL
    value: "http://localhost:3000"

resources:
  - name: serving-endpoint
    serving_endpoint:
      name: ${var.serving_endpoint_name}
      permission: CAN_QUERY
