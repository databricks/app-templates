bundle:
  name: agent-langchain-ts

variables:
  serving_endpoint_name:
    description: "The name of the Databricks model serving endpoint to use"
    default: "databricks-claude-sonnet-4-5"

  resource_name_suffix:
    description: "Suffix to add to resource names for uniqueness"
    default: "dev"

  mlflow_experiment_id:
    description: "UC-backed MLflow experiment ID written by npm run quickstart"
    default: ""

  mlflow_tracing_warehouse_id:
    description: "SQL warehouse used to provision and query MLflow UC traces"
    default: "<your-mlflow-tracing-warehouse-id>"

include:
  - resources/*.yml

resources:
  apps:
    agent_langchain_ts:
      name: agent-lc-ts-${var.resource_name_suffix}
      description: "TypeScript LangChain agent with MLflow tracing"
      source_code_path: ./
      config:
        command: ["bash", "start.sh"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
            value_from: "mlflow-tracing-warehouse"
          - name: MLFLOW_UC_CATALOG
            value: "main"
          - name: MLFLOW_UC_SCHEMA
            value: "agent_traces"
          - name: MLFLOW_UC_TABLE_PREFIX
            value: "agents_on_apps"
          - name: MLFLOW_OTEL_SPANS_TABLE
            value: "main.agent_traces.agents_on_apps_otel_spans"
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

        # UC-backed MLflow experiment provisioned by npm run quickstart
        - name: experiment
          experiment:
            experiment_id: ${var.mlflow_experiment_id}
            permission: CAN_MANAGE

        - name: mlflow-tracing-warehouse
          sql_warehouse:
            id: ${var.mlflow_tracing_warehouse_id}
            permission: CAN_USE

        # Add additional resources here as needed:
        # - Unity Catalog tables, functions, or vector search indexes
        # - Genie spaces for natural language data queries
        # - External MCP servers
        # See .claude/skills/add-tools/ for examples

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production

    # Production-specific configuration
    variables:
      resource_name_suffix:
        default: "prod"
