command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
    valueFrom: "mlflow-tracing-warehouse"
  - name: MLFLOW_UC_CATALOG
    value: "main"
  - name: MLFLOW_UC_SCHEMA
    value: "agent_traces"
  - name: MLFLOW_UC_TABLE_PREFIX
    value: "agents_on_apps"
  - name: MLFLOW_OTEL_SPANS_TABLE
    value: "main.agent_traces.agents_on_apps_otel_spans"
  - name: LAKEBASE_AUTOSCALING_ENDPOINT
    valueFrom: "postgres"
  - name: LAKEBASE_AGENT_MEMORY_SCHEMA
    value: "agent_langgraph_memory"
