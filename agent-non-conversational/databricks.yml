bundle:
  name: agent_non_conversational

resources:
  apps:
    agent_non_conversational:
      name: "agent-non-conversational"
      description: "Non-conversational agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-server"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
            value_from: "mlflow-tracing-warehouse"
          - name: MLFLOW_UC_CATALOG
            value: "main"
          - name: MLFLOW_UC_SCHEMA
            value: "agent_traces"
          - name: MLFLOW_UC_TABLE_PREFIX
            value: "agents_on_apps"
          - name: MLFLOW_OTEL_SPANS_TABLE
            value: "main.agent_traces.agents_on_apps_otel_spans"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: ""
            permission: 'CAN_MANAGE'
        - name: 'mlflow-tracing-warehouse'
          sql_warehouse:
            id: "<your-mlflow-tracing-warehouse-id>"
            permission: 'CAN_USE'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_non_conversational:
          name: agent-non-conversational
