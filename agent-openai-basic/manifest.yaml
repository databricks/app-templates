version: 1
name: "Agent - OpenAI Basic"
description: "A lean OpenAI Agents SDK agent backend that runs locally with no database. Exposes the Responses API; optionally adds Lakebase-backed long-running background execution and durable session history when configured."

resource_specs:
  - name: "experiment"
    description: "Optional. The destination experiment for MLflow traces from the agent's execution."
    experiment_spec:
      permission: "CAN_EDIT"
  - name: "postgres"
    description: "Optional. A Lakebase Autoscaling database backing LongRunningAgentServer's durable store — long-running background execution and crash recovery. Omit to run in-request. (Conversation history is separate: local SQLite by default, or a managed session store via AGENT_SESSION_STORE.)"
    postgres_spec:
      permission: "CAN_CONNECT_AND_CREATE"
