bundle:
  name: appkit-all-in-one

variables:
  mlflow_experiment_id:
    description: MLflow experiment ID
  mlflow_tracing_warehouse_id:
    description: SQL warehouse ID for MLflow UC tracing
  agents_serving_endpoint_name:
    description: Default LLM serving endpoint name
  sql_warehouse_id:
    description: SQL Warehouse ID
  files_path:
    description: Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)
  files_id:
    description: Permission to write to volumes
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.
  serving_endpoint_name:
    description: Serving endpoint name
  # Provisioned by `npm run setup`; defaults keep the generated bundle explicit.
  MLFLOW_UC_CATALOG:
    description: Unity Catalog catalog for MLflow trace tables
    default: main
  MLFLOW_UC_SCHEMA:
    description: Unity Catalog schema for MLflow trace tables
    default: agent_traces
  MLFLOW_UC_TABLE_PREFIX:
    description: Prefix shared by the MLflow UC trace tables
    default: appkit
  MLFLOW_OTEL_SPANS_TABLE:
    description: Fully qualified MLflow OTel spans table
    default: main.agent_traces.appkit_otel_spans

resources:
  apps:
    app:
      name: "appkit-all-in-one"
      description: "Full-stack Node.js app with traced agents, SQL analytics dashboards, file browser, Genie AI conversations, Lakebase Autoscaling (Postgres) CRUD, and Model Serving"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
        - files.files
        - serving.serving-endpoints

      # The resources which this app has access to.
      resources:
        - name: mlflow-experiment
          experiment:
            experiment_id: ${var.mlflow_experiment_id}
            permission: CAN_MANAGE
        - name: mlflow-tracing-warehouse
          sql_warehouse:
            id: ${var.mlflow_tracing_warehouse_id}
            permission: CAN_USE
        - name: agents-serving-endpoint
          serving_endpoint:
            name: ${var.agents_serving_endpoint_name}
            permission: CAN_QUERY
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: files
          uc_securable:
            securable_full_name: ${var.files_id}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://your-workspace.cloud.databricks.com

    variables:
      mlflow_experiment_id: placeholder
      mlflow_tracing_warehouse_id: placeholder
      agents_serving_endpoint_name: placeholder
      sql_warehouse_id: placeholder
      files_path: placeholder
      genie_space_id: placeholder
      genie_space_name: placeholder
      postgres_branch: placeholder
      postgres_database: placeholder
      postgres_project: placeholder
      serving_endpoint_name: placeholder
      MLFLOW_UC_CATALOG: main
      MLFLOW_UC_SCHEMA: agent_traces
      MLFLOW_UC_TABLE_PREFIX: appkit
      MLFLOW_OTEL_SPANS_TABLE: main.agent_traces.appkit_otel_spans
