version: 1
name: "Chat UI (Streamlit)"
description: "A Streamlit chat UI that queries a remote agent endpoint or foundation model hosted on Databricks Model Serving."

resource_specs:
  - name: "serving-endpoint"
    description: "The Databricks Model Serving endpoint hosting the LLM or agent that powers the app's responses."
    serving_endpoint_spec:
      permission: "CAN_QUERY"
  - name: mlflow-experiment
    description: The remote agent's MLflow experiment with immutable UC trace storage.
    experiment_spec:
      permission: CAN_READ
  - name: mlflow-tracing-warehouse
    description: SQL warehouse used to verify the remote trace in Unity Catalog.
    sql_warehouse_spec:
      permission: CAN_USE
