bundle:
  name: e2e-chatbot-model-service

variables:
  model_service_name:
    description: "Name of the Unity Catalog model service (3-part UC name, e.g. system.ai.claude-sonnet-4-5) to be used by the app. This isn't wired into a bundle resource below (no model-service DAB/Apps resource type exists yet) -- it's for documentation/consistency only. Set DATABRICKS_MODEL_SERVICE directly in app.yaml to the same value."
    # TODO: uncomment the line below and specify a default value to avoid needing to specify it on each deployment
    # default: "system.ai.claude-sonnet-4-5"
  database_instance_name:
    description: "Base name of the Lakebase database instance"
    default: "chatbot-lakebase"
  resource_name_suffix:
    description: "Suffix for resource names (app/lakebase instance names etc). Helpful for avoiding name collisions if multiple users deploy this app to the same workspace"

resources:
  database_instances:
    # TODO (optional): Uncomment the database resource below to enable persistent chat history
    # chatbot_lakebase:
    #   name: ${var.database_instance_name}-${var.resource_name_suffix}
    #   capacity: CU_1

  apps:
    databricks_chatbot:
      # NOTE: customize the app name here, if desired
      name: db-chatbot-model-service-${var.resource_name_suffix}
      description: "Agentic Chat application for Unity Catalog model services (Unity Gateway)"
      source_code_path: .
      resources:
        # NOTE: there is no model-service DAB/Apps resource type yet, so
        # there is no `resources` entry here for the model service.
        # DATABRICKS_MODEL_SERVICE is set as a plain literal env value in
        # app.yaml instead, and the app's
        # service principal must be granted EXECUTE on the model service,
        # plus USE CATALOG / USE SCHEMA on its containing catalog/schema, via
        # Unity Catalog grants -- out-of-band, outside of this bundle.
        # TODO (optional): Uncomment the database resource below to bind the app to the database instance above
        # and enable persistent chat history
        # - name: database
        #   description: "Lakebase database instance for the chat app"
        #   database:
        #     database_name: databricks_postgres
        #     instance_name: ${resources.database_instances.chatbot_lakebase.name}
        #     permission: CAN_CONNECT_AND_CREATE
        # TODO (optional): Uncomment the experiment resource below to enable the feedback widget.
        # Find or create an MLflow experiment to link, and set its experiment ID below.
        # Note: enabling feedback also requires a database (uncomment both TODO database blocks above).
        # - name: experiment
        #   description: "MLflow experiment for collecting user feedback"
        #   experiment:
        #     experiment_id: "your-experiment-id"
        #     permission: CAN_EDIT

targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: dev-${workspace.current_user.domain_friendly_name}

  staging:
    mode: production
    variables:
      resource_name_suffix: "staging"

  prod:
    mode: production
    variables:
      resource_name_suffix: "prod"
