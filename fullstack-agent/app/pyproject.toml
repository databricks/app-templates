[project]
name = "app"
version = "0.1.0"
description = "The agent app on the Agent Bricks runtime, with on-behalf-of-user authorization."
requires-python = ">=3.11,<3.12"
dependencies = [
    "databricks-agentbricks[openai]==0.5.0",
    "databricks-openai==0.17.1",
    "databricks-sdk==0.150.0",
    "fastapi==0.143.0",
    "mlflow==3.17.0",
    "openai-agents==0.23.1",
    "openai==3.24.0",
    "opentelemetry-distro==0.66b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
