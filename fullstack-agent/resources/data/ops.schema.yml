resources:
  schemas:
    ops:
      catalog_name: ${var.catalog}
      name: ${var.project}_ops
      comment: Access policies, governed write procedures, the audit and Activity tables.
      grants:
        - principal: ${var.data_owner_application_id}
          privileges:
            - USE_SCHEMA
            - CREATE_TABLE
            - CREATE_FUNCTION
        - principal: ${var.app_users_group}
          privileges:
            - USE_SCHEMA
        - principal: ${var.agent_apps_group}
          privileges:
            - USE_SCHEMA
        - principal: ${var.ops_group}
          privileges:
            - USE_SCHEMA
        - principal: ${var.eval_group}
          privileges:
            - USE_SCHEMA
      lifecycle:
        prevent_destroy: true
