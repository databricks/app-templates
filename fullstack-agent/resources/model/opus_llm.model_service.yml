resources:
  model_services:
    opus_llm:
      parent: schemas/${resources.schemas.ops.id}
      model_service_id: opus_llm
      comment: ${var.display_name} assistant model. Claude Opus 5.5. A user may choose it for a run.
      config:
        routing:
          destinations:
            - name: opus
              destination_type: DESTINATION_TYPE_PAY_PER_TOKEN_FOUNDATION_MODEL
              pay_per_token_config:
                model: ${var.opus_model}
              traffic_percentage: 100
        rate_limits:
          - key: RATE_LIMIT_KEY_USER_DEFAULT
            renewal_period: RATE_LIMIT_RENEWAL_PERIOD_MINUTE
            requests: 30
            tokens: 300000
          - key: RATE_LIMIT_KEY_SERVICE
            renewal_period: RATE_LIMIT_RENEWAL_PERIOD_MINUTE
            requests: 300
            tokens: 960000
        inference_table:
          parent: schemas/${resources.schemas.ops.id}
          table_name_prefix: opus_llm
      grants:
        - principal: ${var.app_users_group}
          privileges:
            - EXECUTE
      lifecycle:
        prevent_destroy: true
