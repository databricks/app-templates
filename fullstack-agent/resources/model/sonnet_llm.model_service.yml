resources:
  model_services:
    sonnet_llm:
      parent: schemas/${resources.schemas.ops.id}
      model_service_id: sonnet_llm
      comment: ${var.display_name} assistant model. Claude Sonnet 5.5.
      config:
        routing:
          destinations:
            - name: sonnet
              destination_type: DESTINATION_TYPE_PAY_PER_TOKEN_FOUNDATION_MODEL
              pay_per_token_config:
                model: ${var.sonnet_model}
              traffic_percentage: 100
        rate_limits:
          - key: RATE_LIMIT_KEY_USER_DEFAULT
            renewal_period: RATE_LIMIT_RENEWAL_PERIOD_MINUTE
            requests: 30
            tokens: 300000
          - key: RATE_LIMIT_KEY_SERVICE
            renewal_period: RATE_LIMIT_RENEWAL_PERIOD_MINUTE
            requests: 300
            tokens: 960000
        inference_table:
          parent: schemas/${resources.schemas.ops.id}
          table_name_prefix: sonnet_llm
      grants:
        - principal: ${var.app_users_group}
          privileges:
            - EXECUTE
      lifecycle:
        prevent_destroy: true
