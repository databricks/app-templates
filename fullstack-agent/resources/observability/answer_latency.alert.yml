resources:
  alerts:
    answer_latency:
      display_name: "${var.display_name}: slow answers"
      custom_description: See docs/runbook.md#alerts for what to do.
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT coalesce(percentile(execution_duration_ms / 1e3, 0.95), 0) AS p95_seconds FROM ${var.catalog}.${var.project}_ops.${resources.experiments.agent_traces.trace_location.uc_trace_location.table_prefix}_trace_unified WHERE coalesce(tags['mlflow.traceName'], '') <> 'confirm' AND request_time > current_timestamp() - INTERVAL 1 HOUR"
      schedule:
        quartz_cron_schedule: "0 0/15 * * * ?"
        timezone_id: UTC
      evaluation:
        source:
          name: p95_seconds
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 20
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscriptions}
      permissions:
        - group_name: ${var.ops_group}
          level: CAN_READ
