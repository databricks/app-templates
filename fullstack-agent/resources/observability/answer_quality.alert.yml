resources:
  alerts:
    answer_quality:
      display_name: "${var.display_name}: unsafe or leaking answers"
      custom_description: See docs/runbook.md#alerts for what to do.
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT count_if((name IN ('safety', 'pii_detection') AND value::string = 'no') OR (name = 'reply_shows_an_id' AND value::string = 'yes')) AS failed_answers FROM ${var.catalog}.${var.project}_ops.${resources.experiments.agent_traces.trace_location.uc_trace_location.table_prefix}_otel_annotations WHERE deleted_at IS NULL AND created_at > current_timestamp() - INTERVAL 1 HOUR"
      schedule:
        quartz_cron_schedule: "0 0/15 * * * ?"
        timezone_id: UTC
      evaluation:
        source:
          name: failed_answers
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscriptions}
      permissions:
        - group_name: ${var.ops_group}
          level: CAN_READ
