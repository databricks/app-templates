resources:
  alerts:
    app_acl_changes:
      display_name: "${var.display_name}: agent app permissions changed"
      custom_description: See docs/runbook.md#alerts for what to do.
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT count(*) AS acl_changes FROM system.access.audit WHERE service_name = 'apps' AND action_name = 'changeAppsAcl' AND request_params['request_object_id'] = '${var.agent_app_name}' AND event_time > current_timestamp() - INTERVAL 2 HOURS"
      schedule:
        quartz_cron_schedule: "0 0 * * * ?"
        timezone_id: UTC
      evaluation:
        source:
          name: acl_changes
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscriptions}
      permissions:
        - group_name: ${var.ops_group}
          level: CAN_READ
