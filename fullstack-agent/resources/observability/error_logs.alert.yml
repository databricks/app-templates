resources:
  alerts:
    error_logs:
      display_name: "${var.display_name}: app error records"
      custom_description: See docs/runbook.md#alerts for what to do.
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT count(*) AS error_records FROM ${var.catalog}.${var.project}_ops.${var.app_telemetry_table_prefix}_otel_logs WHERE severity_text = 'ERROR' AND instrumentation_scope.name IS NOT NULL AND time > current_timestamp() - INTERVAL 15 MINUTES"
      schedule:
        quartz_cron_schedule: "0 0/15 * * * ?"
        timezone_id: UTC
      evaluation:
        source:
          name: error_records
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscriptions}
      permissions:
        - group_name: ${var.ops_group}
          level: CAN_READ
