resources:
  alerts:
    read_failures:
      display_name: "${var.display_name}: failed reads"
      custom_description: See docs/runbook.md#alerts for what to do.
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT count_if(attributes:code::string IN ('QUERY_FAILED', 'QUERY_TIMEOUT')) AS read_failures FROM ${var.catalog}.${var.project}_ops.${var.app_telemetry_table_prefix}_otel_logs WHERE time > current_timestamp() - INTERVAL 15 MINUTES"
      schedule:
        quartz_cron_schedule: "0 0/15 * * * ?"
        timezone_id: UTC
      evaluation:
        source:
          name: read_failures
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 2
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscriptions}
      permissions:
        - group_name: ${var.ops_group}
          level: CAN_READ
