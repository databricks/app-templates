resources:
  alerts:
    run_errors:
      display_name: "${var.display_name}: failed runs"
      custom_description: See docs/runbook.md#alerts for what to do.
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT coalesce(avg(CASE WHEN state = 'ERROR' THEN 1.0 ELSE 0.0 END), 0) AS error_share FROM ${var.catalog}.${var.project}_ops.${resources.experiments.agent_traces.trace_location.uc_trace_location.table_prefix}_trace_unified WHERE request_time > current_timestamp() - INTERVAL 1 HOUR"
      schedule:
        quartz_cron_schedule: "0 0/15 * * * ?"
        timezone_id: UTC
      evaluation:
        source:
          name: error_share
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0.05
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscriptions}
      permissions:
        - group_name: ${var.ops_group}
          level: CAN_READ
