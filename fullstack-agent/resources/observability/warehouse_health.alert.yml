resources:
  alerts:
    warehouse_health:
      display_name: "${var.display_name}: app warehouse slow or cancelling"
      custom_description: See docs/runbook.md#alerts for what to do.
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT count(*) AS slow_or_canceled FROM system.query.history WHERE compute.warehouse_id = '${resources.sql_warehouses.app_warehouse.id}' AND start_time > current_timestamp() - INTERVAL 30 MINUTES AND (execution_status = 'CANCELED' OR waiting_for_compute_duration_ms > 30000)"
      schedule:
        quartz_cron_schedule: "0 0/15 * * * ?"
        timezone_id: UTC
      evaluation:
        source:
          name: slow_or_canceled
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscriptions}
      permissions:
        - group_name: ${var.ops_group}
          level: CAN_READ
