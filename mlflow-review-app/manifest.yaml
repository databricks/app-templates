version: 1
name: 'MLflow Review App'
description: 'A custom reviewer UI for MLflow Review Queues, built on the MLflow Python SDK. You own the UI; the app checks that each reviewer is a queue member.'

resource_specs:
  - name: 'experiment'
    description: 'The MLflow experiment that holds the review queues.'
    experiment_spec:
      permission: 'CAN_EDIT'
  - name: 'sql-warehouse'
    description: 'The SQL warehouse used to read and write Unity Catalog traces.'
    sql_warehouse_spec:
      permission: 'CAN_USE'

# Used only by the /setup page's "Grant access" button, to run the trace-table GRANTs as the user.
user_api_scopes:
  - 'sql'
