command: ['npm', 'run', 'start']
env:
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: DATABRICKS_ENDPOINT
    value: 'databricks-gpt-5-4-mini'
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: 'databricks-gte-large-en'
  - name: RAG_RESEED
    value: 'false'
  # AppKit enables its Remote Bridge dev tunnel on deployed apps for any app user unless this is set.
  - name: DISABLE_REMOTE_SERVING
    value: 'true'
