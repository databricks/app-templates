command: ["npm", "run", "start"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_GENIE_SPACE_ID
    valueFrom: genie-space
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # AppKit enables its Remote Bridge dev tunnel on deployed apps for any app user unless this is set.
  - name: DISABLE_REMOTE_SERVING
    value: 'true'
